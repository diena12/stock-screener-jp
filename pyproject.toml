[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-screener-jp"
version = "0.1.0"
description = "CLI screener for Japanese dividend and growth stocks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "rich>=13.0",
]

[project.scripts]
stock-screen = "stock_screener.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
